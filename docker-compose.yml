services:
  postgres:
    image: postgres:16
    container_name: minilpp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: minilpp
      POSTGRES_USER: minilpp
      POSTGRES_PASSWORD: minilpp
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - minilpp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minilpp -d minilpp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minilpp-data:
